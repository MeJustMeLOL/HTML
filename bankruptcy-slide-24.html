<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slide 24: Tổng kết Bài học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;900&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="slides-enhanced.css">
  <style>:root { --bg-image: url('https://images.unsplash.com/photo-1454165833767-027ffea9e778?auto=format&fit=crop&w=1920&q=80'); }</style>
</head>
<body>
  <div class="viewport" id="slide">
    <div class="light-trait trait-1"></div>
    <div class="light-trait trait-2"></div>
    <div class="light-trait trait-3"></div>
    <div class="corner-glow cg-tl"></div>
    <div class="corner-glow cg-br"></div>
    <div class="content-stage">
      <div class="meta-tag" style="margin-bottom: 20px;">SYNTHESIS HUB</div>
      <span style="font-size: 12px; font-weight: 700; color: var(--color-accent); letter-spacing: 0.6em; text-transform: uppercase; margin-bottom: 25px; display: block; text-align: center; opacity: 0.8;">Key Takeaways</span>
      <h1>TỔNG KẾT<br>BÀI HỌC</h1>
      <div class="summary-grid">
        <div class="summary-item">
          <span class="item-num">POINT 01</span>
          <p class="item-text">Tiêu chí chậm trả nợ 3/6 tháng là căn cứ tối thượng của Luật 2025.</p>
        </div>
        <div class="summary-item">
          <span class="item-num">POINT 02</span>
          <p class="item-text">Tòa án khu vực chuyên biệt là trung tâm của sự chuyên nghiệp hóa.</p>
        </div>
        <div class="summary-item">
          <span class="item-num">POINT 03</span>
          <p class="item-text">Ưu tiên tối đa cho các giải pháp phục hồi thay vì thanh lý tài sản.</p>
        </div>
      </div>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
<script>
  (function(){
    const s = document.getElementById('slide');
    const tl = document.getElementById('timeline');
    const sessionIdx = 23;
    for(let i=0; i<25; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === sessionIdx ? ' active' : (i < sessionIdx ? ' past' : ''));
      tl.appendChild(d);
    }
    window.addEventListener('message', (ev) => {
      if (ev.data.type === 'animate-slide') s.classList.add('active');
      if (ev.data.type === 'reset') s.classList.remove('active');
    });
    window.onload = () => {
      try { window.parent.postMessage({ type: 'slide-ready' }, '*'); } catch(e){}
      setTimeout(() => s.classList.add('active'), 200);
    };
  })();
</script>
</body>
</html>
